<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15151a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="メモ">
<title>メモ</title>
<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf8; --ink:#1d1c1a; --sub:#6b675f; --faint:#9b968c;
  --line:#e7e1d5; --line2:#d8d0c0; --acc:#b4412a; --acc-ink:#fff; --acc-soft:#f6e4dc;
  --link:#2f53b8; --hover:#f1ece2; --me:#fff3d1; --meline:#d9a93a; --mark:#ffe08a;
  --todo:#6b6f78; --todo-bg:#eeeef0; --doing:#1d5bd0; --doing-bg:#e3ebfc; --wait:#7a3fc4; --wait-bg:#efe6fb;
  --done:#2a8a51; --done-bg:#e2f3e8; --ask:#a35f00; --ask-bg:#fcefd6; --hold:#5a6372; --hold-bg:#e8ebef;
  --high:#c8352d; --mid:#d48a0b; --low:#a3a7ae;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","BIZ UDPMincho",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  --r:14px; --shadow:0 1px 0 rgba(60,45,20,.04),0 6px 20px -12px rgba(60,45,20,.25);
  --side:236px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15151a; --paper:#1e1e24; --ink:#ecebe8; --sub:#a7a39b; --faint:#77736c;
  --line:#2c2c33; --line2:#3a3a42; --acc:#ef7a5c; --acc-ink:#1b120f; --acc-soft:#3a231c;
  --link:#93acff; --hover:#26262d; --me:#33291a; --meline:#b48a35; --mark:#7a6512;
  --todo:#b5b8bf; --todo-bg:#2b2c31; --doing:#8db0ff; --doing-bg:#1e2a47; --wait:#c4a2f5; --wait-bg:#31254a;
  --done:#80d4a2; --done-bg:#1b3325; --ask:#f3b85e; --ask-bg:#3a2d16; --hold:#a9b1bf; --hold-bg:#292d34;
  --high:#ff7d74; --mid:#f2b45a; --low:#6e7279; --shadow:none;
}}
*{box-sizing:border-box}
html{overflow-x:clip}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
button,input{font:inherit;color:inherit}
.hide{display:none!important}

/* ロック */
#lock{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
#lock form{width:100%;max-width:360px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:var(--shadow)}
#lock h1{font:600 26px/1.3 var(--serif);margin:0 0 20px}
#lock input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);font-size:16px}
#lock label{display:flex;gap:8px;align-items:center;margin:12px 0;color:var(--sub);font-size:14px}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:var(--acc-ink);font-weight:700;cursor:pointer;width:100%}
#err{color:var(--high);font-size:14px;min-height:1.4em;margin-top:8px}

/* 枠 */
#app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100dvh;overflow-x:clip}
aside{position:sticky;top:0;height:100dvh;overflow:auto;padding:26px 14px 22px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.brand{font:700 22px/1 var(--serif);padding:0 12px 4px;letter-spacing:.04em}
.brand-sub{font-size:12px;color:var(--faint);padding:0 12px 18px}
.grp{font-size:11px;color:var(--faint);letter-spacing:.14em;margin:18px 12px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:10px;color:var(--ink);cursor:pointer;font-size:14px;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--paper);box-shadow:var(--shadow);font-weight:700}
.nav.on .ic{color:var(--acc)}
.nav .ic{width:18px;text-align:center;color:var(--faint);flex:none}
.nav .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.newb{font-size:11px;color:var(--acc-ink);background:var(--acc);border-radius:999px;padding:0 7px;line-height:18px;font-weight:700}
.side-foot{margin-top:auto;padding:20px 12px 0;font-size:12px;color:var(--faint);line-height:1.8}
.side-foot button{border:1px solid var(--line2);background:none;border-radius:8px;padding:3px 10px;cursor:pointer;font-size:12px;margin-top:6px;color:var(--sub)}
main{min-width:0;padding:40px 48px 96px;max-width:1240px}
#menu,#veil{display:none}

/* 見出し */
.hero{margin-bottom:28px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--acc);font-weight:700;margin-bottom:6px}
.hero h1{font:700 34px/1.25 var(--serif);margin:0;letter-spacing:.02em}
.hero p{color:var(--sub);margin:10px 0 0;max-width:720px}
.hero .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero .row .grow{flex:1;min-width:260px}
.ghost{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line2);border-radius:999px;padding:6px 14px;color:var(--ink);background:var(--paper);white-space:nowrap}
.ghost:hover{text-decoration:none;border-color:var(--acc);color:var(--acc)}
h2.sec{font:700 20px/1.4 var(--serif);margin:36px 0 14px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font:500 13px var(--sans);color:var(--faint)}
h2.sec a{margin-left:auto;font:600 13px var(--sans)}

/* 絞り込み */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:220px;max-width:380px;padding:9px 16px;border:1px solid var(--line2);border-radius:999px;background:var(--paper)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;color:var(--sub)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bar .num{margin-left:auto;font-size:13px;color:var(--faint)}

/* 小物 */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;white-space:nowrap;line-height:22px}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-block;font-size:12px;color:var(--sub);background:var(--hover);border-radius:6px;padding:0 8px;line-height:22px;white-space:nowrap}
.due{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:0 8px;line-height:22px;white-space:nowrap}
.due.over{color:var(--high);background:color-mix(in srgb,var(--high) 14%,transparent)}
.due.today{color:var(--ask);background:var(--ask-bg)}
.due.soon{color:var(--doing);background:var(--doing-bg)}
.due.later{color:var(--sub);background:var(--hover)}
.pdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.muted{color:var(--faint);font-size:13px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:40px;text-align:center;color:var(--faint);border:1px dashed var(--line2);border-radius:var(--r)}

/* タスクカード */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:start}
.col-h{display:flex;align-items:center;gap:8px;margin:0 2px 12px;font-weight:700;font-size:14px}
.col-h .cnt{font-size:13px}
.col{display:flex;flex-direction:column;gap:12px;min-height:60px}
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;box-shadow:var(--shadow);position:relative;transition:transform .15s,border-color .15s}
.tcard:hover{border-color:var(--line2);transform:translateY(-1px)}
.tcard.flash{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.tcard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;padding-right:44px}
.due small{font-weight:600;opacity:.85;margin-left:4px}
.tcard h3{font-size:15px;line-height:1.6;margin:0 0 6px;font-weight:700}
.tcard .meta{font-size:12px;color:var(--faint)}
.tcard details{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.tcard summary{cursor:pointer;font-size:12px;color:var(--sub);list-style:none}
.tcard summary::-webkit-details-marker{display:none}
.tcard summary:before{content:"＋ "}
.tcard details[open] summary:before{content:"－ "}
.tcard details p{font-size:13px;color:var(--sub);margin:6px 0 0;white-space:pre-wrap}
.tcard .no{position:absolute;top:12px;right:14px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.tcard.done h3{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line2)}
.fold{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
.fold>summary{cursor:pointer;font-weight:700;color:var(--sub);font-size:14px}
.fold .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}

/* ダッシュボード */
.today{font:700 15px var(--sans);color:var(--sub)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 16px 6px 12px;cursor:pointer;font-size:14px}
.stat:hover{border-color:var(--ink)}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}
.focus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.focus .tcard{padding:18px 20px}
.focus .tcard h3{font-size:16px}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px;align-items:start}
.quote{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.quote:last-child{border-bottom:0}
.quote:hover .qt{color:var(--acc)}
.quote .qt{font-size:14px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.quote .qm{font-size:12px;color:var(--faint);margin-bottom:2px}
.tl{position:relative;padding-left:4px}
.tli{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:10px 0;cursor:pointer}
.tli:hover .tt{color:var(--acc)}
.tli .dd{text-align:center;border-right:2px solid var(--line);padding-right:12px}
.tli .dd b{display:block;font:700 22px/1.1 var(--serif)}
.tli .dd span{font-size:11px;color:var(--faint)}
.tli .tt{font-size:14px;font-weight:600}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:6px 20px;box-shadow:var(--shadow)}
.chrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.chrow:last-child{border-bottom:0}
.chrow:hover{color:var(--acc)}
.chrow .grow{flex:1}

/* 全員 */
.people{columns:3 320px;column-gap:18px}
.people .person{break-inside:avoid;margin-bottom:18px}
.person{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.person .ph{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.person .ph b{font:700 18px var(--serif)}
.prog{height:6px;background:var(--hover);border-radius:9px;overflow:hidden;margin-top:4px;width:140px}
.prog i{display:block;height:100%;background:var(--done)}
.ptask{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ptask .t{flex:1;min-width:0}
.ptask.done .t{color:var(--faint);text-decoration:line-through}

/* 予定 */
.rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.rcard .when{font:700 15px var(--serif);color:var(--acc)}
.big-tl .tli{grid-template-columns:86px 1fr;padding:16px 0;border-bottom:1px solid var(--line)}
.big-tl .tli .dd b{font-size:26px}

/* ルール */
.toc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.rules{counter-reset:r;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:34px 1fr;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;align-items:start}
.rules li:before{counter-increment:r;content:counter(r);width:28px;height:28px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:13px}
.rules .src{font-size:12px;color:var(--faint);margin-top:2px}

/* アカウント・メンバー */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.acard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);position:relative}
.acard.mine{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.acard .ribbon{position:absolute;top:16px;right:16px;font-size:11px;font-weight:800;color:var(--acc-ink);background:var(--acc);border-radius:999px;padding:1px 9px}
.acard h3{font:700 21px/1.35 var(--serif);margin:0 0 4px;padding-right:80px}
.acard .lead{color:var(--sub);font-size:14px;margin:0 0 12px}
.acard .st{font-size:14px;margin:10px 0 12px;padding:10px 12px;background:var(--hover);border-radius:10px}
.acard.past{opacity:.7}
.mcard{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.mcard b{display:block;font-size:15px}
.mcard span{font-size:13px;color:var(--sub)}

/* リンク */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.lcard{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink)}
.lcard:hover{text-decoration:none;border-color:var(--acc)}
.lcard:hover b{color:var(--acc)}
.lcard .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.lcard b{display:block;font-size:14px;line-height:1.5}
.lcard .meta{font-size:12px;color:var(--faint);margin-top:2px}
.lgrid.pin .lcard{padding:18px 20px;border-width:1px;box-shadow:var(--shadow)}

/* 用語 */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.gl{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.gl dt{font:700 16px var(--serif);margin-bottom:4px}
.gl dd{margin:0;font-size:14px;color:var(--sub)}

/* チャット */
.chat{max-width:880px}
.day{display:flex;align-items:center;gap:14px;margin:28px 0 12px;color:var(--faint);font-size:12px;font-weight:700;letter-spacing:.06em}
.day:before,.day:after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:4px 12px;border-radius:10px;position:relative}
.msg:hover{background:var(--hover)}
.msg.first{margin-top:12px;padding-top:8px}
.msg.me{background:var(--me);box-shadow:inset 3px 0 0 var(--meline)}
.msg.flash{background:var(--acc-soft)!important}
.msg .av{width:36px;height:36px;font-size:13px}
.msg .tmr{font-size:11px;color:var(--faint);text-align:center;padding-top:3px;opacity:0}
.msg:hover .tmr{opacity:1}
.hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.au{font-weight:700;font-size:14px}
.tm{color:var(--faint);font-size:12px}
.cn{font-size:12px;color:var(--acc);cursor:pointer}
.rp{font-size:13px;color:var(--sub);border-left:3px solid var(--line2);padding-left:8px;margin:2px 0 4px}
.ct{white-space:pre-wrap;word-break:break-word}
.lk{font-size:13px;margin-top:2px}
.ex{font-size:12px;color:var(--faint)}
.newline{display:flex;align-items:center;gap:10px;color:var(--acc);font-size:12px;font-weight:800;margin:18px 0 6px}
.newline:after{content:"";flex:1;height:1px;background:var(--acc)}
.more{display:block;margin:6px auto 18px;border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:7px 18px;cursor:pointer}
.res{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;cursor:pointer}
.res:hover{border-color:var(--acc)}
.res .meta{font-size:12px;color:var(--faint)}
.res-msg{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:4px 0}

@media (max-width:1180px){ .board{grid-template-columns:repeat(2,minmax(0,1fr))} .focus{grid-template-columns:1fr 1fr} }
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(84vw,300px);z-index:20;transform:translateX(-100%);transition:transform .2s;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.open aside{transform:none}
  body.open #veil{display:block}
  #veil{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15}
  #menu{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line2);background:var(--paper);border-radius:10px;cursor:pointer;margin-bottom:14px}
  main{padding:18px 16px 80px}
  .hero h1{font-size:26px}
  .board,.focus,.two{grid-template-columns:1fr}
  .people,.cards,.gloss{grid-template-columns:1fr}
  .msg{grid-template-columns:34px 1fr;padding:4px 6px}
  .msg .av{width:30px;height:30px;font-size:12px}
}
</style>
</head>
<body>
<div id="lock">
  <form id="lf">
    <h1>メモ</h1>
    <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" required>
    <label><input id="rem" type="checkbox" checked> この端末で覚える</label>
    <button class="btn" id="go">開く</button>
    <div id="err"></div>
  </form>
</div>
<div id="app" class="hide">
  <aside id="side"></aside>
  <div id="veil"></div>
  <main id="main"></main>
</div>
<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const ME = /(@のむ|のむさん|のむ さん|野村)/;
const LS = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const u8 = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
const b64 = (a) => btoa(String.fromCharCode(...new Uint8Array(a)));
let D = null, ENC = null;

/* ---------- 復号 ---------- */
async function load(){ if(!ENC){ const r = await fetch("data.enc?" + Date.now(), {cache:"no-store"}); ENC = await r.json(); } return ENC; }
async function open(key){
  const e = await load();
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(e.iv)}, key, u8(e.ct));
  let txt;
  try { const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip")); txt = await new Response(s).text(); }
  catch(x){ throw new Error("このブラウザは古くて開けません（最新の Chrome / Edge / Safari で開いてください）"); }
  D = JSON.parse(txt); prepare();
  $("#lock").classList.add("hide"); $("#app").classList.remove("hide");
  route();
}
async function tryRemembered(){
  const k = LS.get("k"); if(!k) return;
  try{ const e = await load(); if(LS.get("ks") !== e.salt) throw 0;
    await open(await crypto.subtle.importKey("raw", u8(k), "AES-GCM", false, ["decrypt"]));
  }catch(x){ LS.del("k"); }
}
$("#lf").addEventListener("submit", async (ev) => {
  ev.preventDefault(); $("#err").textContent = "開いています…"; $("#go").disabled = true;
  try{
    const e = await load();
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode($("#pw").value.trim()), "PBKDF2", false, ["deriveKey"]);

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reEsc = (q) => q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const TZ = "Asia/Tokyo";
const fmt = (t, o) => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleString("ja-JP", {timeZone:TZ, ...o}); };
const hm = (t) => fmt(t, {hour:"2-digit", minute:"2-digit"});
const md = (t) => fmt(t, {month:"numeric", day:"numeric", weekday:"short"});
const ymd = (t) => fmt(t, {year:"numeric", month:"numeric", day:"numeric", weekday:"short"});
const jstParts = (t) => { const p = {}; new Intl.DateTimeFormat("en-US",{timeZone:TZ,month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date(t)).forEach(x => p[x.type] = x.value); return p; };
function shortUrl(u){
  try{ const x = new URL(u.replace(/&amp;/g,"&")); const p = x.pathname;
    if(/docs\.google\.com/.test(x.host)){ const k = p.split("/")[1]; return "Google " + ({document:"ドキュメント",spreadsheets:"スプレッドシート",presentation:"スライド",forms:"フォーム"}[k] || "Docs") + " ↗"; }
    if(/drive\.google\.com/.test(x.host)) return "Google ドライブ" + (p.includes("folders") ? "（フォルダ）" : "") + " ↗";
    return x.host.replace(/^www\./,"") + (p.length > 1 ? p.slice(0, 24) + (p.length > 24 ? "…" : "") : "") + " ↗";

}
function hl(html, q){

}
function linkify(s, q){

}

function dueOf(text){

  const t = today(); const a = new Date(2026, t.mo - 1, t.d), b = new Date(2026, +m[1] - 1, +m[2]);

  let h = hero("タスク", "予定・締切", "決まっている日付と、くり返しの予定・目標。", editBtn());
  h += `<h2 class="sec">くり返し・目標</h2><div class="rec">${rec.map(r => `<div class="rcard"><div class="when">${esc(r["日時"])}</div><div>${esc(r["内容"])}</div><div class="muted">${esc(r["アカウント"])}${r["元の発言"] ? "　💬 " + srcLinks(r["元の発言"]) : ""}</div></div>`).join("")}</div>`;
  h += `<h2 class="sec">日付が決まっているもの</h2><div class="box big-tl">${dated.map(({r, d}) => { const m = r["日時"].match(/(\d{1,2})\/(\d{1,2})/); const past = d !== null && d < 0; return `<div class="tli" style="${past ? "opacity:.55" : ""}"><div class="dd"><b>${m ? +m[2] : "—"}</b><span>${m ? +m[1] + "月" : esc(r["日時"])}</span></div><div><div class="tt">${esc(r["内容"])}</div><div class="muted">${esc(r["日時"])}　${esc(r["アカウント"])}　${d === 0 ? '<span class="due today">今日</span>' : past ? "終了" : ""}${r["元の発言"] ? "　💬 " + srcLinks(r["元の発言"]) : ""}</div></div></div>`; }).join("")}</div>`;
  $("#main").innerHTML = h;
}

/* ---------- ルール ---------- */
function viewRules(){
  const list = rows("ルール"); const cats = [...new Set(list.map(r => r["分類"]))];
  let h = hero("ガイド", "ルール", "先生が決めた進め方。新しく決まったものは下に追加されます。", editBtn());
  h += `<div class="toc">${cats.map(c => `<a class="chip" href="#p=sheet&s=${encodeURIComponent("ルール")}&cat=${encodeURIComponent(c)}">${esc(c)}（${list.filter(r => r["分類"] === c).length}）</a>`).join("")}</div>`;
  h += cats.map(c => `<h2 class="sec" id="cat-${esc(c)}">${esc(c)}</h2><ol class="rules">${list.filter(r => r["分類"] === c).map(r => `<li><div>${linkify(r["ルール"])}<div class="src">出典　${srcLinks(r["元の発言"])}</div></div></li>`).join("")}</ol>`).join("");
  $("#main").innerHTML = h;
  const cat = params().get("cat"); if(cat){ const el = document.getElementById("cat-" + cat); if(el) requestAnimationFrame(() => el.scrollIntoView({block:"start"})); }
}

/* ---------- アカウント・メンバー ---------- */
function viewAccounts(){
  const list = rows("アカウント");
  let h = hero("ガイド", "アカウント", "チームで運営している SNS アカウント。", editBtn());
  h += `<div class="cards">${list.map(r => { const mine = /のむ/.test(r["担当"]); const past = /過去/.test(r["アカウント"]); return `<article class="acard${mine ? " mine" : ""}${past ? " past" : ""}">${mine ? `<span class="ribbon">あなたの担当</span>` : ""}<h3>${esc(r["アカウント"])}</h3><p class="lead">${esc(r["どんなキャラ・内容"])}</p><div class="muted">担当　${esc(r["担当"])}</div>${r["今の状況"] ? `<div class="st">${linkify(r["今の状況"])}</div>` : ""}<div class="chips">${String(r["SNS"]).split(/[／\/]/).filter(Boolean).map(s => `<span class="tag">${esc(s.trim())}</span>`).join("")}</div></article>`; }).join("")}</div>`;
  $("#main").innerHTML = h;
}
function viewMembers(){
  const list = rows("メンバー");
  let h = hero("ガイド", "メンバー", "サーバーの参加者と役割。", editBtn());
  h += `<div class="cards">${list.map(r => `<div class="mcard">${avatar(r["名前"])}<div><b>${esc(r["名前"])}</b><span>${esc(r["役割"])}</span></div></div>`).join("")}</div>`;
  $("#main").innerHTML = h;
}

/* ---------- リンク集 ---------- */
const LV = {q:"", type:""};
function viewLinks(){
  const list = rows("リンク集");
  const types = [...new Set(list.map(r => r["種類"]).filter(Boolean))];
  let h = hero("ガイド", "リンク集", "チャットに出てきた資料。★はよく使うもの。", editBtn());
  h += `<div class="bar"><input class="search" id="q" type="search" placeholder="資料を探す" value="${esc(LV.q)}"><div class="chips"><button class="chip${!LV.type ? " on" : ""}" data-t="">すべて</button>${types.map(t => `<button class="chip${LV.type === t ? " on" : ""}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div><span class="num" id="num"></span></div><div id="lk"></div>`;
  $("#main").innerHTML = h;
  const COL = {"ドキュメント":["文","#3b6fd8"],"スプレッドシート":["表","#1f9a55"],"スライド":["ス","#d68a10"],"フォルダ":["▤","#6b7280"],"ファイル":["▶","#b4412a"]};
  const card = (r) => { const [ic, c] = COL[r["種類"]] || ["↗", "#888"]; const name = (r["名前（分かるもの）"] || "").replace(/^★/, "") || (r["その時の発言"] || "").replace(/https?:\S+/g, "").replace(/[─━—]+/g, " ").trim().slice(0, 40) || `${r["投稿者"]}さんが共有した${r["種類"] || "資料"}`;
    return `<a class="lcard" href="${esc(r["URL"])}" target="_blank" rel="noopener noreferrer"><span class="ico" style="background:${c}">${ic}</span><span><b>${hl(esc(name), LV.q)}</b><span class="meta">${esc(r["種類"])}・${esc(r["投稿者"])}・${esc(r["初めて出た日時"])}・#${esc(r["チャンネル"])}</span></span></a>`; };
  const draw = () => {
    const q = LV.q.trim().toLowerCase();
    const f = list.filter(r => (!LV.type || r["種類"] === LV.type) && (!q || Object.values(r).join(" ").toLowerCase().includes(q)));
    const pin = f.filter(r => /^★/.test(r["名前（分かるもの）"])), rest = f.filter(r => !pin.includes(r));
    $("#lk").innerHTML = (pin.length ? `<h2 class="sec">よく使う</h2><div class="lgrid pin">${pin.map(card).join("")}</div>` : "") + (rest.length ? `<h2 class="sec">すべての資料<small>${rest.length}件</small></h2><div class="lgrid">${rest.map(card).join("")}</div>` : "") || `<div class="empty">見つかりません</div>`;
    $("#num").textContent = `${f.length}件`;
  };
  draw();
  $("#q").oninput = (e) => { LV.q = e.target.value; draw(); };
  document.querySelectorAll("[data-t]").forEach(el => el.onclick = () => { LV.type = el.dataset.t; document.querySelectorAll("[data-t]").forEach(x => x.classList.toggle("on", x === el)); draw(); });
}

/* ---------- 用語集・はじめに ---------- */
function viewGlossary(){
  const list = rows("用語集");
  let h = hero("ガイド", "用語集", "チャットで出てくる言葉の意味。", editBtn()) + `<div class="bar"><input class="search" id="q" type="search" placeholder="言葉を探す"><span class="num" id="num"></span></div><div id="gl"></div>`;
  $("#main").innerHTML = h;
  const draw = (q = "") => { const f = list.filter(r => !q || (r["言葉"] + r["意味"]).toLowerCase().includes(q.toLowerCase()));
    $("#gl").innerHTML = f.length ? `<dl class="gloss">${f.map(r => `<div class="gl"><dt>${hl(esc(r["言葉"]), q)}</dt><dd>${hl(esc(r["意味"]), q)}</dd></div>`).join("")}</dl>` : `<div class="empty">見つかりません</div>`; $("#num").textContent = `${f.length}語`; };
  draw(); $("#q").oninput = (e) => draw(e.target.value.trim());
}

/* ---------- チャット ---------- */
function msgHtml(m, o = {}){
  const me = ME.test(m.c || "") ? " me" : "";
  const full = !o.compact;
  let h = `<div class="msg${me}${full ? " first" : ""}" id="m${m.i}">` + (full ? avatar(m.a) : `<span class="tmr">${hm(m.t)}</span>`) + `<div style="min-width:0">`;
  if(full){
    h += `<div class="hd"><span class="au">${esc(m.a)}</span><span class="tm">${o.date ? md(m.t) + " " : ""}${hm(m.t)}</span>`;
    if(o.ch) h += `<span class="cn" data-go="${J({p:"ch", c:m.ch.id, m:m.i})}">#${esc(m.ch.name)} で見る →</span>`;
    h += `</div>`;
  }
  if(m.r) h += `<div class="rp">↩ ${linkify(m.r)}</div>`;
  if(m.c) h += `<div class="ct">${linkify(m.c, o.q)}</div>`;
  if(m.l){ const inC = m.c || ""; const extra = m.l.filter(u => !inC.includes(u.split("?")[0])); if(extra.length) h += `<div class="lk">${extra.map(u => `🔗 <a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(u)}">${shortUrl(u)}</a>`).join("　")}</div>`; }
  if(m.x && !m.c) h += `<div class="ex">${esc(m.x)}</div>`;
  return h + `</div></div>`;
}
let shown = 400;
function viewCh(id, target){
  const c = D.channels.find(x => x.id === id); if(!c) return viewHome();
  if(target){ const idx = c.m.findIndex(m => m.i === target); if(idx >= 0) shown = Math.max(shown, c.m.length - idx + 30); }
  const start = Math.max(0, c.m.length - shown);
  const prevSeen = seen(c.id);
  let h = hero("チャンネル", "# " + c.name, esc(CHAN_DESC[c.name] || "") + `　<span class="muted">${c.m.length}件</span>`, `<a class="ghost" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">Discordで開く ↗</a>`) + `<div class="chat">`;
  if(start > 0) h += `<button class="more" id="more">もっと前を見る（あと${start}件）</button>`;
  let day = "", prev = null, marked = false;
  for(const m of c.m.slice(start)){
    const d = ymd(m.t); let brk = false;
    if(d !== day){ day = d; brk = true; h += `<div class="day">${d}</div>`; }
    if(!marked && prevSeen !== "0" && BigInt(m.i) > BigInt(prevSeen)){ marked = true; brk = true; h += `<div class="newline" id="newline">ここから新着</div>`; }
    const compact = !brk && prev && prev.a === m.a && !m.r && (new Date(m.t) - new Date(prev.t)) < 7 * 60e3;
    h += msgHtml(m, {compact}); prev = m;
  }
  $("#main").innerHTML = h + `</div>`;
  if(c.m.length) LS.set("seen:" + c.id, c.m[c.m.length - 1].i);
  side();
  const mb = $("#more"); if(mb) mb.onclick = () => { shown += 400; viewCh(id); window.scrollTo(0, 0); };
  requestAnimationFrame(() => {
    const t = target && document.getElementById("m" + target);
    if(t){ t.scrollIntoView({block:"center"}); t.classList.add("flash"); setTimeout(() => t.classList.remove("flash"), 2500); }
    else if($("#newline")) $("#newline").scrollIntoView({block:"start"});
    else window.scrollTo(0, document.body.scrollHeight);
  });
}
function viewRecent(){
  const all = D.channels.flatMap(c => c.m);
  const last = Math.max(...all.map(m => +new Date(m.t) || 0));
  const ms = all.filter(m => +new Date(m.t) >= last - 3 * 864e5).sort((a, b) => BigInt(b.i) > BigInt(a.i) ? 1 : -1);
  let h = hero("チャット", "最近の会話", `全チャンネルの直近3日間・新しい順・${ms.length}件`) + `<div class="chat">`, day = "";
  for(const m of ms){ const d = ymd(m.t); if(d !== day){ day = d; h += `<div class="day">${d}</div>`; } h += msgHtml(m, {ch:true}); }
  $("#main").innerHTML = h + `</div>`;
}
function viewSearch(q){
  $("#main").innerHTML = hero("チャット", "検索", "タスク・ルール・資料とチャットの全部から探します") + `<div class="bar"><input class="search" id="q" type="search" placeholder="例: 競馬、@のむ、CTA、締切" value="${esc(q || "")}" style="max-width:560px"></div><div id="res" class="chat"></div>`;
  const inp = $("#q"); let tm;
  const PAGE = {"のむのタスク":"わたしのタスク","全員のタスク":"みんなのタスク"};
  const run = () => {
    const v = inp.value.trim(); history.replaceState(null, "", "#" + new URLSearchParams({p:"search", q:v}));
    if(!v){ $("#res").innerHTML = `<div class="empty">言葉を入れてください</div>`; return; }
    const lv = v.toLowerCase();
    const sh = []; for(const s of D.sheets || []) if(s.name !== "チャンネル" && s.name !== "はじめに") rows(s.name).forEach(r => { if(Object.values(r).join(" ").toLowerCase().includes(lv)) sh.push({s:s.name, r}); });
    const re = new RegExp(reEsc(v), "i");
    const hit = D.channels.flatMap(c => c.m).filter(m => re.test((m.c || "") + " " + m.a + " " + (m.l || []).join(" "))).sort((a, b) => BigInt(b.i) > BigInt(a.i) ? 1 : -1);
    const main = (r) => r["やること"] || r["ルール"] || r["内容"] || r["名前（分かるもの）"] || r["言葉"] || r["アカウント"] || r["名前"] || Object.values(r).find(x => typeof x === "string" && x) || "";
    let h = `<h2 class="sec">タスク・ガイド<small>${sh.length}件</small></h2>`;
    h += sh.slice(0, 60).map(({s, r}) => `<div class="res" data-go="${J({p:"sheet", s, row:String(r._i)})}"><div class="meta">${esc(PAGE[s] || s)}</div>${hl(esc(main(r)), v)}</div>`).join("") || `<div class="muted">なし</div>`;
    h += `<h2 class="sec">チャット<small>${hit.length}件・新しい順</small></h2>`;
    h += (hit.slice(0, 200).map(m => `<div class="res-msg">${msgHtml(m, {ch:true, date:true, q:v})}</div>`).join("") || `<div class="muted">なし</div>`) + (hit.length > 200 ? `<div class="muted">多いので200件まで表示しています</div>` : "");
    $("#res").innerHTML = h;
  };
  inp.oninput = () => { clearTimeout(tm); tm = setTimeout(run, 200); };
  run(); inp.focus();
}

/* ---------- 切り替え ---------- */
const SHEET_VIEW = {"のむのタスク":viewTasks,"全員のタスク":viewAll,"予定・締切":viewSchedule,"ルール":viewRules,"アカウント":viewAccounts,"メンバー":viewMembers,"リンク集":viewLinks,"用語集":viewGlossary};
function route(){
  if(!D) return;
  document.body.classList.remove("open");
  const p = params(), page = p.get("p") || "home";
  if(page !== "ch" && !p.has("row") && !p.has("cat")) window.scrollTo(0, 0);
  if(page === "sheet") (SHEET_VIEW[p.get("s")] || viewHome)();
  else if(page === "ch"){ shown = 400; viewCh(p.get("c"), p.get("m")); }
  else if(page === "recent") viewRecent();
  else if(page === "search") viewSearch(p.get("q") || "");
  else viewHome();
  if(page !== "ch") side();
  const mb = $("#menu"); if(mb) mb.onclick = () => document.body.classList.add("open");
}
window.addEventListener("hashchange", route);
document.addEventListener("click", (e) => {
  if(e.target.closest("a, summary, input")) return;
  const g = e.target.closest("[data-go]"); if(g){ go(JSON.parse(g.dataset.go)); return; }
  const n = e.target.closest("[data-nav]"); if(n){ const k = n.dataset.nav; go(k === "home" || k === "recent" || k === "search" ? {p:k} : {p:"sheet", s:k}); return; }
  const c = e.target.closest("[data-ch]"); if(c){ go({p:"ch", c:c.dataset.ch}); }
});
$("#veil").onclick = () => document.body.classList.remove("open");
tryRemembered();
})();
</script>
